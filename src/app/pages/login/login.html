<main class="login-page">
  <section class="login-card">
    <div class="brand">
      <span class="logo">🛒</span>
      <h1>E-Commerce</h1>
      <p>Panel de administración de productos</p>
    </div>

    <form (ngSubmit)="submit()" novalidate>
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" [(ngModel)]="username"
             placeholder="admin" autocomplete="username" />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password"
             placeholder="••••••••" autocomplete="current-password" />

      @if (error()) {
        <div class="error" role="alert">{{ error() }}</div>
      }

      <button id="btn-login" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <footer>Anderson Larios Tito · n003849813</footer>
  </section>
</main>
