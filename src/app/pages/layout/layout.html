<div class="shell">
  <header class="topbar">
    <button id="btn-menu" class="burger" (click)="toggle()" aria-label="Abrir menú">☰</button>
    <span class="topbar-title">🛒 E-Commerce</span>
  </header>

  @if (open()) {
    <div class="backdrop" (click)="close()"></div>
  }

  <aside class="sidebar" [class.open]="open()">
    <div class="side-brand">🛒 <span>E-Commerce</span></div>

    <nav>
      <a id="menu-productos" routerLink="/productos" routerLinkActive="active" (click)="close()">
        <span class="ico">📦</span> Productos
      </a>
    </nav>

    <div class="side-footer">
      <div class="user">
        <span class="avatar">{{ auth.username().charAt(0).toUpperCase() }}</span>
        <span class="uname">{{ auth.username() }}</span>
      </div>
      <button id="btn-logout" class="logout" (click)="logout()">⏻ Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
